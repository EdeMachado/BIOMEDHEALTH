name: Database CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'package.json'
      - '.github/workflows/database-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'package.json'
      - '.github/workflows/database-ci.yml'

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-gate:
    name: Database gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start local Supabase stack
        run: npm run supabase:start

      - name: Reset, lint and validate database
        run: npm run supabase:verify

      - name: Show Supabase status on failure
        if: failure()
        run: npm run supabase:status || true

      - name: Stop local Supabase stack
        if: always()
        run: npm run supabase:stop || true
