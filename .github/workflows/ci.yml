name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Temporary deterministic compatibility step. The current root lockfile was
      # generated on Windows and omits native GNU/Linux optional binaries required
      # by Tailwind CSS. Remove this step after the canonical root lockfile is
      # regenerated on Linux.
      - name: Install Tailwind Linux native binaries
        run: >-
          npm install --no-save --ignore-scripts
          lightningcss-linux-x64-gnu@1.30.1
          @tailwindcss/oxide-linux-x64-gnu@4.1.13

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit and integration tests
        run: npm test

      - name: Build
        run: npm run build
